name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's preinstalled rustup reads rust-toolchain.toml, so the
      # channel and components are pinned in one place rather than restated
      # here. Runs before the cache so the cache is keyed on the pinned rustc.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: bin/check
